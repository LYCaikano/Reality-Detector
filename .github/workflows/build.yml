name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name Reality-detector `
            --collect-all scapy `
            --hidden-import _tkinter `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.messagebox `
            main.py

      - name: Verify build output
        run: |
          if (Test-Path "dist/Reality-detector.exe") {
            $size = (Get-Item "dist/Reality-detector.exe").Length / 1MB
            Write-Host "Build successful: Reality-detector.exe ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "Build failed: Reality-detector.exe not found"
            exit 1
          }

      - name: Stage release files
        run: |
          Copy-Item "characteristic_original.txt" "dist/"
          Copy-Item "characteristic_alert.txt" "dist/"

      - name: Upload release files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reality-detector-windows
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reality-detector.exe
            characteristic_original.txt
            characteristic_alert.txt
          body: |
            ## VLESS/REALITY Traffic Detector

            ### Prerequisites
            - **Npcap** must be installed: [https://npcap.com/](https://npcap.com/) (enable "WinPcap API-compatible Mode")
            - **geoip.dat** must be placed in the same directory as the executable. Download from [v2fly/geoip releases](https://github.com/v2fly/geoip/releases)

            ### Usage
            1. Download all release files (`Reality-detector.exe`, `characteristic_original.txt`, `characteristic_alert.txt`)
            2. Place them in the same folder along with `geoip.dat`
            3. Run `Reality-detector.exe` as Administrator

            ### Included Files
            | File | Description |
            |------|-------------|
            | `Reality-detector.exe` | Main application (all Python dependencies bundled) |
            | `characteristic_original.txt` | CCS/AppData probe payloads |
            | `characteristic_alert.txt` | TLS Alert probe payloads |
          generate_release_notes: true

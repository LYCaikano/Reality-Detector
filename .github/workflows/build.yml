name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download geoip.dat
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/v2fly/geoip/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "geoip.dat" }
          if ($asset) {
            Write-Host "Downloading geoip.dat from $($asset.browser_download_url)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "geoip.dat"
            $size = (Get-Item "geoip.dat").Length / 1MB
            Write-Host "Downloaded geoip.dat ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "geoip.dat not found in latest release"
            exit 1
          }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name Reality-detector `
            --collect-all scapy `
            --hidden-import gen_geo_cache `
            --hidden-import _tkinter `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.messagebox `
            main.py

      - name: Verify build output
        run: |
          if (Test-Path "dist/Reality-detector.exe") {
            $size = (Get-Item "dist/Reality-detector.exe").Length / 1MB
            Write-Host "Build successful: Reality-detector.exe ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "Build failed: Reality-detector.exe not found"
            exit 1
          }

      - name: Stage and package release
        run: |
          Copy-Item "characteristic_original.txt" "dist/"
          Copy-Item "characteristic_alert.txt" "dist/"
          Copy-Item "geoip.dat" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "Reality-detector-windows.zip"
          $size = (Get-Item "Reality-detector-windows.zip").Length / 1MB
          Write-Host "Package created: Reality-detector-windows.zip ($([math]::Round($size, 2)) MB)"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reality-detector-windows
          path: Reality-detector-windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reality-detector-windows.zip
          body: |
            ## VLESS/REALITY Traffic Detector

            ### Prerequisites
            - **Npcap**: [https://npcap.com/](https://npcap.com/) (install with **"WinPcap API-compatible Mode"** enabled)

            ### Usage
            1. Download `Reality-detector-windows.zip`
            2. Extract to any folder
            3. Run `Reality-detector.exe` as Administrator

            ### Package Contents
            | File | Description |
            |------|-------------|
            | `Reality-detector.exe` | Main application (all Python dependencies bundled) |
            | `geoip.dat` | GeoIP database for CN IP filtering (from [v2fly/geoip](https://github.com/v2fly/geoip)) |
            | `characteristic_original.txt` | CCS/AppData probe payloads |
            | `characteristic_alert.txt` | TLS Alert probe payloads |
          generate_release_notes: true

name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scapy>=2.5.0
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole `
            --name vless-detector `
            --add-data "characteristic_original.txt;." `
            --add-data "characteristic_alert.txt;." `
            --add-data "geo_matcher.py;." `
            --add-data "gen_geo_cache.py;." `
            --hidden-import scapy.layers.tls `
            --hidden-import scapy.layers.inet `
            --hidden-import scapy.layers.inet6 `
            --hidden-import scapy.layers.l2 `
            --hidden-import scapy.arch.windows `
            main.py

      - name: Verify build output
        run: |
          if (Test-Path "dist/vless-detector.exe") {
            $size = (Get-Item "dist/vless-detector.exe").Length / 1MB
            Write-Host "Build successful: vless-detector.exe ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "Build failed: vless-detector.exe not found"
            exit 1
          }

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vless-detector-windows
          path: dist/vless-detector.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vless-detector.exe
            characteristic_original.txt
            characteristic_alert.txt
          body: |
            ## VLESS/REALITY Traffic Detector

            ### Prerequisites
            - **Npcap** must be installed: [https://npcap.com/](https://npcap.com/) (enable "WinPcap API-compatible Mode")
            - **geoip.dat** must be placed in the same directory as the executable. Download from [v2fly/geoip releases](https://github.com/v2fly/geoip/releases)

            ### Usage
            1. Download `vless-detector.exe`, `characteristic_original.txt`, and `characteristic_alert.txt`
            2. Place them in the same folder along with `geoip.dat`
            3. Run `vless-detector.exe` (as Administrator if needed)

            ### Included Files
            | File | Description |
            |------|-------------|
            | `vless-detector.exe` | Main application (all Python dependencies bundled) |
            | `characteristic_original.txt` | CCS/AppData probe payloads |
            | `characteristic_alert.txt` | TLS Alert probe payloads |
          generate_release_notes: true
